app = "jason-kb"
primary_region = "hkg"

[build]

[env]
  MCP_TRANSPORT = "sse"
  PORT = "8080"
  DATA_DIR = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "stop"
  min_machines_running = 0

[[mounts]]
  source = "jason_kb_data"
  destination = "/data"
