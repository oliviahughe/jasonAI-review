services:
  jason-kb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jason-kb
    restart: unless-stopped
    env_file:
      - .env.tencent
    environment:
      MCP_TRANSPORT: streamable_http
      PORT: 8080
      DATA_DIR: /data
    ports:
      - "8080:8080"
    volumes:
      - ./runtime-data:/data
